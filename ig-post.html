<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IG Post Frame</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;display:flex;justify-content:center;align-items:flex-start;padding:20px}
  /* 4:5 Instagram frame */
  .frame{width:540px;height:675px;position:relative;overflow:hidden;background:#fff;flex-shrink:0}
  .frame iframe{border:0;transform-origin:0 0;position:absolute;top:0;left:0}
  .wm{position:absolute;bottom:14px;right:16px;z-index:5;
    font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="frame" id="frame"></div>
<script>
const p=new URLSearchParams(location.search);
const site=p.get('site')||'demo-dental.html';
const y=parseInt(p.get('y')||'0');
const W=parseInt(p.get('w')||'420');        // content width in CSS px (phone width)
const dark=p.get('dark')==='1';
const FW=540, FH=675;
const scale=FW/W;                            // scale phone width up to fill the frame
const H=Math.ceil(FH/scale);                 // how much page height fits

const frame=document.getElementById('frame');
frame.innerHTML=`<iframe id="ifr" src="${site}" scrolling="no"
   style="width:${W}px;height:${H}px;transform:scale(${scale})"></iframe>
 <div class="wm" style="color:${dark?'rgba(255,255,255,.45)':'rgba(0,0,0,.3)'}">OKTO</div>`;

const ifr=document.getElementById('ifr');
ifr.onload=()=>{
  try{
    const d=ifr.contentDocument;
    // remove our demo labels / footers so the post shows only the website
    d.querySelectorAll('.explain,.demo-b,.demo-badge,.demo-tag,footer,.foot,.fnote').forEach(e=>e.remove());
    // finish all scroll-reveal animations
    d.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));
    const apply=()=>{
      d.documentElement.style.scrollBehavior='auto';
      d.documentElement.scrollTop=y;
      d.body.scrollTop=y;
      // hide any sticky header after the first slide so it doesn't repeat
      if(y>0){ const n=d.querySelector('nav'); if(n) n.style.position='static'; d.documentElement.scrollTop=y; }
    };
    apply(); setTimeout(apply,250); setTimeout(apply,700);
  }catch(e){}
};
</script>
</body>
</html>
